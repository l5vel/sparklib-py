    # -- status frame periods ---------------------------------------------------
    # CAN-verifiable: NO. Not because tooling is missing, but because on pre-25
    # these are NOT PARAMETERS. Ids 158-165 were probed on api class 48 and every
    # one replied with a NON-ZERO status byte, which is a refusal, not silence.
    # The period moves on api class 6 instead:
    #     arb = 0x02051800 + (frame_index << 6) + device_id
    #     2 bytes, little-endian ms, DLC 2, NO acknowledgement of any kind
    # SparkAdmin.set_legacy_status_period in spark_admin.py. Because there is no
    # acknowledgement and no readback, the only confirmation available is
    # watching the frame's arrival cadence change on the wire, which is why
    # Status 4 below cannot be confirmed at all.
    #
    # The param_id column keeps REV's canonical ids from rev_parameter_index.tsv
    # so the two product files line up row for row. On this firmware those ids are
    # REFUSED. Do not write them with write_legacy_param.
    #
    # THESE DO NOT SURVIVE A POWER CYCLE, AND NO BURN MAKES THEM. Measured on
    # base02, 2026-09-08: id 3 had 0x060 set to a distinctive 77 ms -- neither
    # REV's 10 nor the throttle's 50, so nothing else produces that number -- was
    # burned with api 0x072 and the magic 15011 and accepted with 0x00, and after a
    # rail cycle read 10.0 ms, as did all seven others. The burn
    # commits the parameter table and stops there, so the periods below have to be
    # re-applied after every power event, by the driver at boot or by
    # `spark throttle`.
    #
    # `value` is spark_can._SPARKMAX_STATUS_PERIODS_MS (spark_can.py:25-27), which
    # apply_boot_config sends when the driver constructs or reconfigures a
    # handler (spark_can.py:110, :150). It is this
    # package's own throttle for an 8-motor bus on a gs_usb adapter, not any REV
    # figure. `rev_default` is REV's pre-25 default MEASURED after a rail cycle
    # with nothing re-applying, not the TSV's 25+ numbers.
    - name: Status 0 Period               # CAN-verifiable: NO, refused as a param; api class 6 only
      tab: Status Frame Period
      param_id: 158
      type: UINT32
      value: 50
      rev_default: 10
      deviates: true
    - name: Status 1 Period               # CAN-verifiable: NO, refused as a param; api class 6 only
      tab: Status Frame Period
      param_id: 159
      type: UINT32
      value: 100
      rev_default: 20
      deviates: true
    - name: Status 2 Period               # CAN-verifiable: NO, refused as a param; api class 6 only
      tab: Status Frame Period
      param_id: 160
      type: UINT32
      value: 100
      rev_default: 20
      deviates: true
    - name: Status 3 Period               # CAN-verifiable: NO, refused as a param; api class 6 only
      tab: Status Frame Period
      param_id: 161
      type: UINT32
      value: 500
      rev_default: 50
      deviates: true
    - name: Status 4 Period               # CAN-verifiable: NO, and not even observable
      # apply_boot_config sends 500 ms for frame 4 when it runs. Whether
      # the controller takes it is UNKNOWN: 0x064 does not broadcast, before or
      # after a rail cycle, on any of the eight. That is this firmware not emitting
      # the alternate-encoder frame rather than a lost write, so there is also no
      # REV default to record. Marked deviating on the safe side, meaning re-apply
      # it, because the question cannot be settled from the wire.
      # SETTLED BY: reading param 128 over api class 48, which does answer, or by
      # a REVLib 2024.x header stating which frames 24.0.1 emits.
      tab: Status Frame Period
      param_id: 162
      type: UINT32
      value: 500
      rev_default: unknown
      deviates: true
    - name: Status 5 Period               # CAN-verifiable: NO, refused as a param; api class 6 only
      tab: Status Frame Period
      param_id: 163
      type: UINT32
      value: 1000
      rev_default: 200
      deviates: true
    - name: Status 6 Period               # CAN-verifiable: NO, refused as a param; api class 6 only
      tab: Status Frame Period
      param_id: 164
      type: UINT32
      value: 1000
      rev_default: 200
      deviates: true
    - name: Status 7 Period               # CAN-verifiable: NO, refused as a param; api class 6 only
      # The one period this package never touches. _SPARKMAX_STATUS_PERIODS_MS
      # stops at frame 6, so 0x067 sits at REV's pre-25 default of 250 ms in both
      # states, measured either side of the rail cycle. Not a deviation.
      tab: Status Frame Period
      param_id: 165
      type: UINT32
      value: 250
      rev_default: 250
      deviates: false

  # Differs by what the motor drives. On this fleet this is the ONLY parameter
  # that is not byte-identical across all eight controllers.
  by_role:
    - name: P 0                           # CAN-verifiable: YES, param 13 read on all 8
      # 2.0 on drive (ids 1, 4, 5, 8), 0.1 on steer (ids 2, 3, 6, 7), on
      # can0. Flash-resident: both values survived two rail cycles this
      # session, so a rail cycle does not drop them and a factory reset does.
      # Note the split is the opposite way round from the Flex file, where steer
      # (0.5) is the stiffer of the two and drive is 0.119. Do not carry either
      # pair across products.
      tab: Closed Loop Control Slot 0
      param_id: 13
      type: FLOAT
      rev_default: 0.0
      deviates: true
      values:
        steer: 0.1
        drive: 2.0
