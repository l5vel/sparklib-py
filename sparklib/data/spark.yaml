# sparklib configuration. One file; everything sparklib reads is here.
#
# THIS IS A WORKED EXAMPLE, not a blank template. The bus below is rig-flex:
# eight SPARK Flex on firmware 26.1.6 driving a swerve base, and it is the bus
# most of the measurements in docs/ were taken on. Copy this file, then replace
# `devices`, `serials` and `rig_name` with your own. `spark learn-serials
# --write` fills in the serials for you once the ids are right.
#
# Two things to set before anything works:
#   controller_type   which SPARK product is on the bus
#   can.interface     the netdev name your adapter came up as
#
# Find the netdev name with `ip -d link show type can`. Kernel canN numbering is
# not stable across reboots, so a rig with two adapters should name them with a
# udev rule instead -- docs/CAN-SETUP.md has the rule and how to write it.
#
# The declared settings for BOTH products are in this file, under `sparkflex:`
# and `sparkmax:`. controller_type selects one. `spark audit` compares the live
# bus against the selected block and `spark provision --write` writes it back.


# ---------------------------------------------------------------------------
# The bus
# ---------------------------------------------------------------------------

controller_type: sparkflex        # sparkflex | sparkmax

can:
  interface: gsusb                 # netdev name; see docs/CAN-SETUP.md
  bitrate: 1000000                # SPARK bus is 1 Mbit classic CAN, not FD
  wait_timeout_s: 20              # how long to wait for the netdev (0 = forever)
  skip_gs_usb_rebind: false       # true for a dongle the pre-emptive rebind breaks

# Device ids, grouped by role. Both names are free-form: the roles below happen
# to be a swerve drive, and a single-motor rig is just as valid:
#
#   devices:
#     main: {motor: 1}
#
# The roles named here are what `by_role` in the product blocks keys on, and
# `spark` only ever addresses the SPARK roles. A group of ids belonging to some
# other device -- CANcoders here, on a second adapter -- is listed so the tooling
# knows those ids are spoken for, and is never swept or written.
#
# Ids are unique per BUS, not per robot. Two groups on different adapters may
# hold the same numbers, which is why the selection is by group and not by id.
devices:
  drive:    {LF: 14, RF: 12, LB: 16, RB: 10}
  steer:    {LF: 15, RF: 13, LB: 17, RB: 11}
  cancoder: {LF: 1, RF: 3, LB: 2, RB: 4}      # CTRE, on the second adapter

# Controller serials, written by `spark learn-serials --write`. Addressing a
# controller by serial survives a lost CAN id, which is the failure that makes
# an id-addressed repair impossible.
serials:                                # hardware serials, api 0x2F0
  drive:    {LF: '08FE696E', RF: '6B029ADD', LB: 'F3003513', RB: 'C7B24C10'}
  steer:    {LF: '5400CEBD', RF: '4D9AB6E7', LB: '498B2579', RB: 'AB15F6C7'}

# True if the hardware limit switches on this rig are wired normally-closed.
# Getting this wrong disables a motor silently; see docs/FAILURE-CATALOGUE.md F2.
limit_switch_polarity: false

# The absolute encoder that tells a steer axis which way its wheel points.
# Needs the swerve extra: uv add "sparklib-py[swerve]". Omit this block entirely
# on a rig with no CANcoders and nothing here reads it.
#
# `bus` is the netdev the CANcoders are on, which is usually NOT the SPARK bus:
# a CANivore runs CAN FD at a different bitrate. `offsets_deg` is what each
# encoder reads with that wheel pointed at your chosen zero, recorded once.
# `steer_gear_ratio` is motor revolutions per revolution of the steered axis,
# and getting it wrong moves the axis confidently to the wrong place.
cancoder:
  bus: canivore
  steer_gear_ratio: 26.0           # SDS MK5i; an MK2 is 12.8
  offsets_deg: {LF: 78.07, RF: -94.40, LB: 109.72, RB: -98.26}

# Chassis geometry, read by sparklib.kinematics to turn a driver command into
# per-wheel speed and angle. Measure both between wheel centres, in metres.
# `max_speed` is what full drive output produces on your rig, and it sets the
# scale every module speed is reported against.
#
# Omit this block on anything that is not a four-corner chassis; only the
# kinematics helpers and examples/06_joystick_drive.py read it.
chassis:
  track_width: 0.55               # left wheel centre to right wheel centre
  wheel_base: 0.62                # front wheel centre to back wheel centre
  max_speed: 3.0                  # m/s at full drive output

# Motor-rail battery, for grading the voltage the SPARKs report.
# chemistry: LiFePO4 | SLA, or set full_v and empty_v explicitly.
rail:
  chemistry: LiFePO4

# A label for this bus. It names the snapshot and keys the live-experiment
# guard, so a rig you must not write to can be refused by name.
rig_name: rig-flex


