# ---------------------------------------------------------------------------
# Declared configuration, SPARK MAX
# ---------------------------------------------------------------------------

sparkmax:
  # The SPARK MAX half of the declared motor configuration. Mirrors the schema of
  # sparkflex_motor_defaults.yaml exactly: meta / common / by_role, same per-entry
  # fields, so motor_settings() and deviating_settings() read either one unchanged.
  #
  # This is the file a robot declaring `base.controller_type: sparkmax` reads.
  # `_defaults_path()` in spark_admin.py selects it from MOTOR_DEFAULTS_FILES, and
  # `spark_cli._use_declared_product()` is what hands the product down, because
  # spark_admin does not read baseNN_config.yaml. `require_motor_defaults_for`
  # then checks that meta.applies_to below agrees with the robot that asked, so a
  # wrong edit here is refused rather than written into a controller.
  #
  # What is read from here is NOT what is written to a controller on this
  # generation. Every CAN write this package makes to a pre-25 MAX is RAM only and
  # is lost at the next power cycle -- see SPARKMAX.md section 3. Persistence does
  # exist on the firmware, by the burn described below, but nothing in
  # arm_base_control sends it. `spark repair` refuses on pre-25 before it sends
  # anything, so today this file is what `spark defaults` prints and what an audit
  # compares against.
  #
  # EDIT THIS FILE to change what a MAX should be set to. Per-motor identity lives
  # elsewhere, same as on the Flex side:
  #     CAN id       baseNN_config.yaml  base.can_ids
  #     wheel offset baseNN_config.yaml  base.module_offsets_deg
  # There is no serial row here. Unique ID Broadcast is apiClass 47,
  # versionImplemented 25.0.0 in tests/support/spec/REV-spark-frames-2.1.0.json,
  # so firmware 24.0.1 broadcasts no serial and base.can_serials cannot be filled
  # on this fleet. Parameters 47/48/49, documented "Reserved", read 0xFFFFFFFF and
  # are not serials.
  #
  #
  # WHAT "CAN-verifiable" MEANS HERE
  #
  # Both generations answer a parameter read, in different dialects, and
  # the Flex half of that was only established on 2026-09-09. Measured on
  # base02, 2026-09-04, firmware 24.0.1, 8x SPARK MAX on the 1 Mbit gs_usb adapter
  # can0: all 134 parameters, ids 0 through 133, answered on all eight
  # controllers. Zero refused, zero silent. A MAX does not have to be inferred
  # from its broadcasts; it can be asked. Parameter 0 returns each device's own
  # CAN id, which is the self-check proving the reads are live and per-device.
  #
  # So every parameter entry below carries "CAN-verifiable: YES", and that is new.
  # The status-period entries carry "CAN-verifiable: NO", and that is not a gap in
  # the tooling: on pre-25 they are not parameters at all. See below.
  #
  #
  # WHAT param_id ADDRESSES ON THIS FIRMWARE
  #
  # Not PARAMETER_WRITE. That frame is api class 14 (arb 0x02053800) and
  # versionImplemented 25.0.0, so 24.0.1 does not carry it, and an unmatched
  # extended id is dropped in silence rather than refused. That silence is why
  # this firmware looked unwritable for as long as it did.
  #
  # Pre-25 puts both directions on api class 48:
  #     arb   = 0x02050000 | ((0x300 | param_id) << 6) | device_id
  #     read  = zero-length frame, reply on the SAME arb id
  #     write = 5 bytes [int32 value][type tag], device echoes the value it took
  #     reply = [uint32 value][type tag][status byte], status 0 = ok
  # The LEGACY_PARAM_ACCESS block in spark_admin.py, SparkAdmin.read_legacy_param
  # and write_legacy_param. LEGACY_PARAM_MAX is 133 and the guard in
  # _legacy_param_arb is deliberate: above the table the same api range carries
  # commands, and 255 lands on Persist Parameters.
  #
  # A PLAIN WRITE IS RAM ONLY. Proven, not assumed: Idle Mode was set to BRAKE on
  # all eight, read back as BRAKE, the motor rail was cut and restored, and all
  # eight came back COAST with sticky 0x0200. Flash-resident provisioning was
  # unaffected (P 0 and the stall limit survived both cycles). The 25+ Persist
  # Parameters frame is apiClass 63 idx 15, versionImplemented 25.0.0, so that
  # route does not exist here.
  #
  # A BURN IS NOT A PLAIN WRITE, and this is what changed on 2026-09-08. Measured
  # on base02, firmware 24.0.1: api 0x072, arbitration id 0x02051C80 | id, with a
  # two-byte payload carrying the magic 15011 LITTLE-ENDIAN, replies 0x00 on the
  # request's own arbitration id and COMMITS PARAMETERS 0-133 TO FLASH. Ids 3 and 4
  # were written Idle Mode COAST->BRAKE, burned, and read back BRAKE after a rail
  # cycle while a no-burn control on id 8 read back COAST; both were then burned
  # back to COAST, which also survived a further cycle. A wrong magic, a big-endian
  # magic and a one-byte payload each answer 0xFF, and a zero-length frame is not
  # answered at all. The magic is the same PERSIST_MAGIC the 25+ frame carries:
  # REV's own spec names that signal "Magic Number" with decodedMin == decodedMax
  # == 15011 in tests/support/spec/REV-spark-frames-2.1.0.json. The status periods
  # are NOT part of what the burn commits, measured the same day and recorded with
  # the period entries below.
  #
  # THIS PACKAGE DOES NOT SEND THAT BURN. Nothing in arm_base_control emits api
  # 0x072, it sits on the injector denylist in tests/support/sparkhw/wire.py, and
  # there is no CLI path to it on pre-25. Consequence: on a MAX `spark repair`
  # would still be a re-apply on every boot, not a fix. The authoritative record is
  # the pre25.burn_flash_api claim in spark_provenance.py.
  #
  #
  # THIS FILE RECORDS WHAT THE FLEET HOLDS, NOT AN ASPIRATION
  #
  # The Flex file is prescriptive, and it declares what a motor SHOULD be set to.
  # `spark provision --write --persist` restores every declared setting one
  # controller has drifted on, while `spark repair` puts back Status 1 Period
  # alone. Every value below is instead what was READ off all
  # eight controllers on base02 on 2026-09-04. Two consequences worth stating
  # plainly rather than discovering later:
  #   1. An audit against this file passes by construction. It is a baseline, not
  #      yet a target.
  #   2. Where the Flex fleet is provisioned and this one is not (Idle Mode is
  #      COAST here, not BRAKE; Closed Loop Control Sensor is NONE here, not
  #      MAIN_ENCODER), that difference is recorded as measured. Deciding those
  #      should change is a separate decision. Acting on it is no longer blocked by
  #      the hardware -- the burn above makes a parameter stick -- but it is
  #      blocked by this package, which sends no burn and offers no command that
  #      does. Whether burning as routine practice is wise is a further question:
  #      flash cycles are finite.
  #
  # `deviates: true` keeps the Flex file's meaning: the value differs from REV's
  # factory default, so a factory reset drops it and it must be re-applied. On this
  # fleet exactly two PARAMETERS deviate, ids 13 and 59, and both are
  # flash-resident and survived two rail cycles. The seven status periods that
  # deviate are a stronger case: they are volatile, a rail cycle alone drops them,
  # and the burn does not reach them either. That is why apply_boot_config re-sends
  # them whenever the driver constructs or reconfigures a handler, and why
  # `spark throttle` stays mandatory after every power event on this generation.
  #
  #
  # FLEET DRIFT: NONE
  #
  # All 134 parameters were read from all eight controllers. Exactly ONE differs
  # across the fleet, param 13 "P 0", and it splits cleanly by role rather than by
  # controller: 2.0 on drive (ids 1, 4, 5, 8) and 0.1 on steer (ids 2, 3, 6, 7).
  # The other 133 are byte-identical across all eight. There is zero configuration
  # drift on this fleet, which is why every entry except P 0 sits in `common`.
  #
  #
  # WHAT IS DELIBERATELY NOT AN ENTRY HERE
  #
  #   param 0   CAN ID. Per-motor identity, lives in base.can_ids. It is read as
  #             the liveness self-check, never written by this file.
  #   param 5   Control Type. A RUNTIME value, not stored configuration. It reads
  #             back whatever the controller is currently doing.
  #   136, 137  Uvw Sensor Sample Rate / Average Depth
  #   149-151   Position PID Wrap Enable / Min Input / Max Input
  #   194, 195  Follower Mode Leader Id / Is Inverted
  #             All six are ids above LEGACY_PARAM_MAX and were NOT read this
  #             session, so there is no measured value to record and none is
  #             invented. Whether 24.0.1 carries them at all is an OPEN QUESTION.
  #             Ids 158-165 were probed above the table and came back refused, so
  #             refusal is plausible here too, but plausible is not measured.
  #             SETTLED BY: read_legacy_param on each id with its guard widened,
  #             reads only, never a write, and never anywhere near 242 or 255.
  #   199, 224  Status 8 / Status 9 Period. These frames do not exist on pre-25.
  #             The wire carries 0x060 0x061 0x062 0x063 0x065 0x066 0x067 and
  #             nothing else; no 0x2E0, no 0x2E1, no 0x2F0.
  #
  #
  # SOURCES FOR THE COLUMNS
  #
  # `value` is measured, per the note above. `name`, `type` and the REV default
  # for parameters come from rev_parameter_index.tsv, 199 entries.
  #
  # `rev_default` for the STATUS PERIODS does NOT come from that TSV. The TSV's
  # status-period defaults (159=250, 160-165=20) are the 25+ table and do not
  # describe this firmware. The numbers below were measured on base02 after a rail
  # cycle with nothing re-applying: 0x060=10, 0x061=20, 0x062=20, 0x063=50,
  # 0x065=200, 0x066=200, 0x067=250.
  #
  # `tab` is the RHC grouping carried over verbatim from the Flex file so the two
  # files sort the same way. It was NOT re-checked against RHC2's SPARK MAX view,
  # and it is display only: no code reads it for anything but column order.


  meta:
    source: read over CAN from all 8 controllers on base02, 2026-09-04, firmware
            24.0.1, legacy parameter access on api class 48; names, types and REV
            parameter defaults joined onto rev_parameter_index.tsv
    applies_to: SPARK MAX
    firmware_verified: 24.0.1
    settings: 37
    deviating_from_factory_default: 9

  # Identical on every motor regardless of role. Byte-identical across all eight
  # controllers, measured, not assumed.
  common:
    - name: Motor Type                    # CAN-verifiable: YES, param 2 read on all 8
      tab: Basic
      param_id: 2
      type: UINT32
      value: BRUSHLESS
      rev_default: BRUSHLESS
      deviates: false
    - name: Idle Mode                     # CAN-verifiable: YES, param 6 read on all 8
      # Reads 0 (COAST) on all eight. The Flex file declares BRAKE; this fleet is
      # NOT in BRAKE. BRAKE was written to all eight on 2026-09-04 and read back,
      # then a rail cycle returned every one of them to COAST. Making BRAKE stick
      # needs the burn described in the header, and that burn works: on 2026-09-08
      # ids 3 and 4 were written BRAKE, burned with api 0x072 and the magic 15011,
      # and held BRAKE across a rail cycle. Both were burned back to COAST at the
      # end of that session, so COAST is still what all eight hold. This package
      # sends no burn, so nothing it runs changes that.
      tab: Basic
      param_id: 6
      type: UINT32
      value: COAST
      rev_default: COAST
      deviates: false
    - name: Input Deadband                # CAN-verifiable: YES, param 7 read on all 8
      tab: Basic
      param_id: 7
      type: FLOAT
      value: 0.05
      rev_default: 0.05
      deviates: false
